<body>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

      <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#38bdf8"/>

       vertices: (272,200)(236,262.35)(164,262.35)(128,200)(164,137.65)(236,137.65) -->

       SVG S path (visual center origin, span -48..+24, x -34..+34),
       flipped & placed at (200,200): top=166, bottom=238 (height 72, snug in hex 137.65..262.35). -->

        fill="#080c14" stroke="none"/>
