<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#080c14;display:flex;align-items:center;justify-content:center;height:100%;width:100%}
  svg{display:block}
  .grad0{fill:url(#cg)}
  .thin{stroke:#ffffff;stroke-width:1.1;opacity:0.18;fill:none}
  .bar{fill:url(#cg2)}
  .dot{fill:#38bdf8}
  .lbl{fill:#ffffff;font-weight:700;letter-spacing:7px}
  .sub{fill:#60a5fa;font-weight:300;letter-spacing:15px}
</style>
</head>
<body>
<svg width="560" height="150" viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="560" height="150" fill="#080c14"/>
  <!-- flipped S monogram on the left -->
  <g transform="translate(150,75)">
    <path d="M34,-46 L-34,-46 L-34,-26 L34,-26 L34,0 L-34,0 L-34,26"
          fill="none" stroke="url(#cg)" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
    <path class="thin" d="M34,-46 L-34,-46 L-34,-26 L34,-26 L34,0 L-34,0 L-34,26"/>
  </g>
  <!-- wordmark to the right -->
  <text x="290" y="60" class="lbl" font-family="Segoe UI, Arial, sans-serif" font-size="40">SULLIVAN</text>
  <text x="290" y="84" class="sub" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">TECHNOLOGIES</text>
  <!-- accent bar + dot -->
  <rect x="290" y="94" width="108" height="2.2" rx="1.1" class="bar"/>
  <circle cx="398" cy="95.1" r="2.6" class="dot"/>
</svg>
</body>
</html>
