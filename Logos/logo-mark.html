<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Sullivan Technologies Logo Mark</title>
<style>html,body{margin:0;padding:0;background:#080c14}
svg{display:block;width:100%;height:100%}</style></head>
<body>
<svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- outer hexagon — regular flat-top, R=140 -->
  <polygon points="390,250 320,128.76 180,128.76 110,250 180,371.24 320,371.76"
           fill="none" stroke="#1a1f35" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- inner hexagon — regular flat-top, R=86, blue gradient fill -->
  <polygon points="336,250 293,175.52 207,175.52 164,250 207,324.48 293,324.48"
           fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- accent in Concept 2 (Network Mark) style: hub-and-spoke from inner-hex center to each outer-hex corner. -->
  <g stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" opacity="0.55" fill="none">
    <line x1="250" y1="250" x2="390" y2="250"/>
    <line x1="250" y1="250" x2="320" y2="128.76"/>
    <line x1="250" y1="250" x2="180" y2="128.76"/>
    <line x1="250" y1="250" x2="110" y2="250"/>
    <line x1="250" y1="250" x2="180" y2="371.24"/>
    <line x1="250" y1="250" x2="320" y2="371.24"/>
  </g>
  <!-- faint cross-lines between opposite outer-hex corners (Concept 2 network motif) -->
  <g stroke="#1d4ed8" stroke-width="0.8" stroke-linecap="round" opacity="0.25" fill="none">
    <line x1="180" y1="128.76" x2="320" y2="371.24"/>
    <line x1="320" y1="128.76" x2="180" y2="371.24"/>
  </g>
  <!-- 6 corner dots in #38bdf8 (Concept 2 corner-node style) -->
  <g fill="#38bdf8">
    <circle cx="390" cy="250" r="4.5"/>
    <circle cx="320" cy="128.76" r="4.5"/>
    <circle cx="180" cy="128.76" r="4.5"/>
    <circle cx="110" cy="250" r="4.5"/>
    <circle cx="180" cy="371.24" r="4.5"/>
    <circle cx="320" cy="371.24" r="4.5"/>
  </g>
  <!-- center node in Concept 2 style: gradient-filled circle + faint white ring + dark core -->
  <circle cx="250" cy="250" r="11" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="11" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.35"/>
  <circle cx="250" cy="250" r="4" fill="#080c14"/>
  <!-- soft blue glow behind the center node (Concept 2 glow2) -->
  <circle cx="250" cy="250" r="60" fill="url(#glow2)"/>
</svg>
</body></html>
